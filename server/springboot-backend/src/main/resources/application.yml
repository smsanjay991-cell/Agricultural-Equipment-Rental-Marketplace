server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/${MYSQLDATABASE:${MYSQL_DATABASE:agrirent}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER:${MYSQL_USER:root}}
    password: ${MYSQL_ROOT_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:S.M.Sanjay04}}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: true


  jackson:
    default-property-inclusion: NON_NULL

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

upload:
  path: ${UPLOAD_DIR:uploads}


# JWT Configuration
jwt:
  secret: agrirent_super_secret_2026
  expiration: 2592000000  # 30 days in milliseconds

# Logging
logging:
  level:
    com.agrirent: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
